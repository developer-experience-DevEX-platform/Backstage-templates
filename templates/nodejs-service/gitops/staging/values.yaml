image:
  repository: 980829302319.dkr.ecr.eu-west-2.amazonaws.com/${{ values.name }}
  # Set by the staging GitOps workflow on the first push to main. Empty until
  # then, so nothing is deployed before an image exists.
  tag: ''
  pullPolicy: IfNotPresent

replicaCount: 2

containerPort: 3000

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

livenessProbe:
  enabled: true
  httpGet:
    path: /health

readinessProbe:
  enabled: true
  httpGet:
    path: /health

resources:
  requests:
    cpu: 100m
    memory: 128Mi
