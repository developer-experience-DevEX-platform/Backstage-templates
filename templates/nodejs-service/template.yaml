apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: nodejs-service
  title: Node.js REST API
  description: Creates a Node.js REST API using the company's golden path.
spec:
  owner: platform-engineering
  type: service
  parameters:
    - title: Service Information
      required:
        - name
        - description
        - owner
      properties:
        name:
          title: Service Name
          type: string
          description: The unique name used to identify this service.
          maxLength: 63
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          ui:autofocus: true
          ui:help: Names must use lowercase kebab-case, for example `payments-api`.
        description:
          title: Description
          type: string
          description: Briefly describe what the service does.
          ui:widget: textarea
          ui:options:
            rows: 4
        owner:
          title: Owner
          type: string
          description: The team responsible for this service.
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
            allowArbitraryValues: false
  steps:
    - id: fetchBase
      name: Generate Node.js Service
      action: fetch:template
      input:
        url: ./skeleton
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
