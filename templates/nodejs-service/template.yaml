apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: nodejs-service
  title: Node.js REST API
  description: Creates a Node.js REST API using the company's golden path.
spec:
  owner: platform-engineering
  type: service
  parameters:
    - title: Service Information
      required:
        - name
        - description
        - owner
      properties:
        name:
          title: Service Name
          type: string
          description: The unique name used to identify this service.
          maxLength: 63
          pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
          ui:autofocus: true
          ui:help: Names must use lowercase kebab-case, for example `payments-api`.
        description:
          title: Description
          type: string
          description: Briefly describe what the service does.
          ui:widget: textarea
          ui:options:
            rows: 4
        owner:
          title: Owner
          type: string
          description: The team or individual responsible for this service
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind:
                - Group
                - User
            allowArbitraryValues: false
  steps:
    - id: fetchBase
      name: Generate Node.js Service
      action: fetch:template
      input:
        url: ./skeleton
        copyWithoutTemplating:
          - .github/workflows/**
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
    - id: publishRepository
      name: Publish Repository
      action: publish:github
      input:
        repoUrl: github.com?owner=developer-experience-DevEX-platform&repo=${{ parameters.name }}
        description: ${{ parameters.description }}
        defaultBranch: main
        repoVisibility: public
    - id: provisionServiceIdentity
      name: Request CI identity
      action: github:actions:dispatch
      input:
        repoUrl: github.com?owner=developer-experience-DevEX-platform&repo=platform-infrastructure
        workflowId: bootstrap-service-identity.yml
        branchOrTagName: main
        workflowInputs:
          service_name: ${{ parameters.name }}
          github_repository: ${{ parameters.name }}
    - id: registerComponent
      name: Register Component
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publishRepository.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml
  output:
    links:
      - title: Repository
        url: ${{ steps.publishRepository.output.remoteUrl }}
      - title: Open in Catalog
        entityRef: ${{ steps.registerComponent.output.entityRef }}
