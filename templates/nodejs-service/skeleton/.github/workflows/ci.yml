name: CI

on:
  pull_request:

jobs:
  ci:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: developer-experience-DevEX-platform/ci-cd-templates/.github/workflows/nodejs-ci.yml@main
    with:
      working_directory: .
      dockerfile_path: ./Dockerfile
      node_version: '24'
      has_integration_tests: false
